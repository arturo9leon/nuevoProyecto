<main class="auth-layout">
  <section class="left-panel">
    <div class="top-controls">
      @for (control of topControls; track control.label) {
        <button type="button">
          <span>{{ control.icon }}</span> {{ control.label }}
        </button>
      }
    </div>

    <div class="auth-page">
      <section class="brand-block">
        <div class="brand-logo" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span
          ><span></span>
        </div>
        <h2>{{ brand.title }}</h2>
        <p>{{ brand.subtitle }}</p>
      </section>

      <section class="login-card">
        <h1>{{ formMeta.title }}</h1>
        <p>{{ formMeta.subtitle }}</p>

        <form class="login-form" action="#">
          @for (field of fields; track field.id) {
            <label class="field-label" [for]="field.id">{{
              field.label
            }}</label>
            <div class="field-wrap">
              <span class="field-icon">{{ field.leadingIcon }}</span>
              <input
                [id]="field.id"
                [type]="field.type"
                [placeholder]="field.placeholder"
              />
              @if (field.trailingIcon) {
                <span class="field-icon">{{ field.trailingIcon }}</span>
              }
            </div>
          }

          <button
            class="submit-button"
            type="button"
            [routerLink]="formMeta.submitRoute"
          >
            {{ formMeta.submitText }}
          </button>
        </form>
      </section>
    </div>
  </section>

  <section class="right-panel" aria-hidden="true"></section>
</main>
