<main class="auth-layout">
  <section class="left-panel">
    <div class="top-controls">
      <button type="button" aria-label="Cambiar país">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 2a10 10 0 1 0 10 10A10.011 10.011 0 0 0 12 2Zm6.93 9h-3.11a15.9 15.9 0 0 0-1.24-5.01A8.02 8.02 0 0 1 18.93 11ZM12 4.06c.95 1.22 1.9 3.5 2.15 6.94H9.85C10.1 7.56 11.05 5.28 12 4.06ZM4.07 13h3.11a15.9 15.9 0 0 0 1.24 5.01A8.02 8.02 0 0 1 4.07 13Zm3.11-2H4.07a8.02 8.02 0 0 1 4.35-5.01A15.9 15.9 0 0 0 7.18 11ZM12 19.94c-.95-1.22-1.9-3.5-2.15-6.94h4.3c-.25 3.44-1.2 5.72-2.15 6.94ZM14.58 18.01A15.9 15.9 0 0 0 15.82 13h3.11a8.02 8.02 0 0 1-4.35 5.01Z"
          />
        </svg>
        <span>País</span>
      </button>
      <button type="button" aria-label="Cambiar idioma">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12.87 15.07 9.53 11.7l.03-.03A17.52 17.52 0 0 0 13.07 6H17V4h-7V2H8v2H1v2h10.17A15.63 15.63 0 0 1 8 10.3 15.63 15.63 0 0 1 5.26 8.2L3.84 9.62A17.69 17.69 0 0 0 6.93 12a17.06 17.06 0 0 1-5.14 2.98L2.5 17A19.3 19.3 0 0 0 8 13.8a19.3 19.3 0 0 0 3.5 2.04Zm5.63-5h-2L12 22h2l1.12-3h4.75L21 22h2Zm-2.63 6.9 1.63-4.33 1.63 4.33Z"
          />
        </svg>
        <span>Idioma</span>
      </button>
      <button type="button" aria-label="Modo nocturno">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 3a9 9 0 0 0 0 18 9.06 9.06 0 0 0 6.45-2.7.99.99 0 0 0-.87-1.69A7 7 0 0 1 9.39 8.42a.99.99 0 0 0-1.69-.87A9.06 9.06 0 0 0 5 12a9 9 0 0 0 7 8.77A9 9 0 0 1 12 3Z"
          />
        </svg>
        <span>Nocturno</span>
      </button>
    </div>

    <div class="auth-page">
      <section class="brand-block">
        <div class="brand-logo" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span
          ><span></span>
        </div>
        <h2>eSUPPLIER Portal</h2>
        <p>Portal de Business Partners</p>
      </section>

      <section class="login-card">
        <h1>Iniciar sesión</h1>
        <p>Ingresa tu RUC para acceder</p>

        <form class="login-form">
          <label class="field-label" for="ruc">RUC *</label>
          <div class="field-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4.41 0-8 2.24-8 5v1h16v-1c0-2.76-3.59-5-8-5Z"
              />
            </svg>
            <input id="ruc" type="text" placeholder="RUC" />
          </div>

          <label class="field-label" for="password">Contraseña *</label>
          <div class="field-wrap">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M18 10h-1V8a5 5 0 0 0-10 0v2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2Zm-9-2a3 3 0 0 1 6 0v2H9Zm9 12H6v-8h12Z"
              />
            </svg>
            <input id="password" type="password" placeholder="********" />
            <button
              type="button"
              class="eye-button"
              aria-label="Mostrar contraseña"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 6C6.5 6 2 12 2 12s4.5 6 10 6 10-6 10-6-4.5-6-10-6Zm0 10a4 4 0 1 1 4-4 4 4 0 0 1-4 4Zm0-6a2 2 0 1 0 2 2 2 2 0 0 0-2-2Z"
                />
              </svg>
            </button>
          </div>

          <button class="submit-button" type="submit">Ingresar</button>
        </form>

        <p class="register-text">
          ¿Nuevo business partner? <a href="#">Regístrate aquí</a>
        </p>
      </section>

      <p class="footer-text">© 2026 eSUPPLIER Portal</p>
    </div>
  </section>

  <section class="right-panel" aria-hidden="true"></section>
</main>
